name: Publicar no GitHub Pages

on:
  push:
    branches: [main, work]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos estáticos
        run: |
          mkdir _site
          cp index.html styles.css app.js .nojekyll _site/
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
